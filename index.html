<head>

<title>Ruta FI-MAD-R01A · Marquesinas</title>
<style>
  :root{
    --bg:#EEF0F3; --surface:#FFFFFF; --ink:#12151B; --muted:#6A7280;
    --line:#E2E5EA; --primary:#0B5FFF; --primary-d:#0A4FD6;
    --done:#0E9F6E; --amber:#E8890C; --slate:#8A93A0;
    --shadow:0 1px 2px rgba(16,20,30,.06),0 6px 18px rgba(16,20,30,.08);
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--ink);
    padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 12px);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 14px}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px}
  .brandline{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:baseline;gap:8px}
  .brand b{font-size:18px;letter-spacing:-.02em}
  .brand small{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .reset{border:1px solid var(--line);background:var(--surface);color:var(--muted);
    font-size:12px;font-weight:600;padding:8px 10px;border-radius:10px;cursor:pointer}
  .progress{margin-top:10px}
  .bar{height:10px;background:#DCE0E7;border-radius:999px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),#3B82F6);
    border-radius:999px;transition:width .35s ease}
  .ptxt{display:flex;justify-content:space-between;margin-top:6px;font-size:12.5px;color:var(--muted);font-weight:600}
  .ptxt b{color:var(--ink)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);padding:18px 18px 16px;margin-top:6px}
  .topline{display:flex;align-items:center;gap:12px}
  .num{font-variant-numeric:tabular-nums;font-weight:800;font-size:52px;line-height:.9;letter-spacing:-.03em}
  .num small{font-size:16px;color:var(--muted);font-weight:700;vertical-align:top}
  .badge{margin-left:auto;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    padding:6px 10px;border-radius:999px}
  .b-new{background:#FDF1DF;color:var(--amber)}
  .b-carr{background:#EDF0F4;color:var(--slate)}
  .b-no{background:#fff;color:var(--slate);border:1px dashed var(--line)}
  .calle{font-size:22px;font-weight:750;letter-spacing:-.01em;margin:12px 0 2px;line-height:1.15}
  .ref{color:var(--muted);font-size:14px;font-weight:600}
  .meta{margin-top:12px;display:grid;gap:6px;font-size:13px}
  .meta div{display:flex;gap:8px}
  .meta span{color:var(--muted);min-width:82px;font-weight:600}
  .meta b{font-weight:650}
  .mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}

  .maps{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;border:0;cursor:pointer;text-decoration:none;
    background:var(--primary);color:#fff;font-size:17px;font-weight:750;
    padding:16px;border-radius:14px;box-shadow:0 4px 14px rgba(11,95,255,.28)}
  .maps:active{background:var(--primary-d);transform:translateY(1px)}
  .maps svg{width:20px;height:20px}
  .row{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-top:10px}
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);
    font-size:15px;font-weight:700;padding:14px 8px;border-radius:12px;cursor:pointer}
  .btn:active{transform:translateY(1px)}
  .btn.done{background:var(--done);border-color:var(--done);color:#fff}
  .btn.done:disabled{opacity:.4}
  .btn.ghost{color:var(--muted)}

  .listhead{display:flex;align-items:center;justify-content:space-between;
    margin:20px 4px 8px;font-size:13px;color:var(--muted);font-weight:700;cursor:pointer;user-select:none}
  .listhead .chev{transition:transform .2s}
  .listhead.open .chev{transform:rotate(180deg)}
  ul{list-style:none;margin:0;padding:0;display:none;border:1px solid var(--line);
    border-radius:var(--r);overflow:hidden;background:var(--surface)}
  ul.open{display:block}
  li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
  li:first-child{border-top:0}
  li .ln{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;width:30px;color:var(--muted)}
  li .lc{flex:1;min-width:0}
  li .lc .t{font-size:14.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  li .lc .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  li .dot{width:20px;height:20px;border-radius:999px;border:2px solid var(--line);flex:none}
  li.done{background:#F3FBF7}
  li.done .dot{background:var(--done);border-color:var(--done);position:relative}
  li.done .dot:after{content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  li.cur{background:#EEF4FF}
  li.cur .ln{color:var(--primary)}
  .hint{color:var(--muted);font-size:12px;text-align:center;margin:14px 6px 0;line-height:1.5}
</style>
</head>

-AB-01772.F2.02", "crea": "REPSOL CASTELLANO S.30", "new": "Yes"}, {"n": 130, "addr": "Calle Fuentelarreina, Madrid", "calle": "CL FUENTELARREINA", "ref": "M30", "marco": "ES-MAD-AB-02353.F2.02", "crea": "LOEWE MODELO S.16", "new": "Yes"}];
const KEY = "r01a_v1";

// ---- persistencia con fallback a memoria ----
let mem = {done:[], cur:0};
function load(){ try{ const s=localStorage.getItem(KEY); if(s) return JSON.parse(s);}catch(e){} return mem; }
function save(st){ mem=st; try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
let state = load();
state.done = new Set(state.done||[]);
if(typeof state.cur!=="number") state.cur=0;

const $=s=>document.querySelector(s);
const mapsURL=a=>"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(a)+"&travelmode=driving";

function firstPending(from=0){
  for(let i=from;i<STOPS.length;i++) if(!state.done.has(STOPS[i].n)) return i;
  return -1;
}
function badge(v){
  if(v==="Yes") return ['b-new','Nueva'];
  if(v==="No")  return ['b-no','No'];
  return ['b-carr','Continúa'];
}
function persist(){ save({done:[...state.done], cur:state.cur}); }

function renderCard(){
  const s=STOPS[state.cur]; const [bc,bt]=badge(s.new);
  const isDone=state.done.has(s.n);
  $("#card").innerHTML=`
    <div class="topline">
      <div class="num"><small>#</small>${String(s.n).padStart(3,"0")}</div>
      <div class="badge ${bc}">${bt}</div>
    </div>
    <div class="calle">${s.calle}</div>
    ${s.ref?`<div class="ref">↳ ${s.ref}</div>`:``}
    <div class="meta">
      <div><span>Marco</span><b class="mono">${s.marco}</b></div>
      <div><span>Creatividad</span><b>${s.crea}</b></div>
    </div>
    <a class="maps" href="${mapsURL(s.addr)}" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21s-7-6.3-7-11a7 7 0 1 1 14 0c0 4.7-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
      Abrir en Maps
    </a>
    <div class="row">
      <button class="btn done" id="mark" ${isDone?"disabled":""}>${isDone?"Hecha ✓":"Hecho ✓"}</button>
      <button class="btn ghost" id="skip">Saltar</button>
      <button class="btn ghost" id="prev">Anterior</button>
    </div>`;
  $("#mark").onclick=()=>{ state.done.add(s.n); const nx=firstPending(state.cur+1);
    state.cur = nx>=0 ? nx : Math.min(state.cur+1,STOPS.length-1); persist(); renderAll(); };
  $("#skip").onclick=()=>{ state.cur=Math.min(state.cur+1,STOPS.length-1); persist(); renderAll(); };
  $("#prev").onclick=()=>{ state.cur=Math.max(state.cur-1,0); persist(); renderAll(); };
}

function renderProgress(){
  const d=state.done.size, t=STOPS.length;
  $("#fill").style.width=(t? d/t*100:0)+"%";
  $("#pdone").textContent=d; $("#ptot").textContent=t;
}

function renderList(){
  const ul=$("#list");
  ul.innerHTML=STOPS.map((s,i)=>{
    const cls=[state.done.has(s.n)?"done":"", i===state.cur?"cur":""].join(" ").trim();
    return `<li class="${cls}" data-i="${i}">
      <div class="ln">${String(s.n).padStart(3,"0")}</div>
      <div class="lc"><div class="t">${s.calle}</div><div class="s">${s.crea}</div></div>
      <div class="dot"></div></li>`;
  }).join("");
  ul.querySelectorAll("li").forEach(li=>li.onclick=()=>{
    state.cur=+li.dataset.i; persist(); renderAll();
    document.querySelector(".card").scrollIntoView({behavior:"smooth",block:"start"});
  });
}

function renderAll(){ renderCard(); renderProgress(); renderList(); }

$("#listhead").onclick=()=>{ $("#list").classList.toggle("open"); $("#listhead").classList.toggle("open"); };
$("#reset").onclick=()=>{ if(confirm("¿Reiniciar el progreso de la ruta?")){ state={done:new Set(),cur:0}; persist(); renderAll(); } };

renderAll();
</script>
