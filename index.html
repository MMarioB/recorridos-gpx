  .progress{margin-top:10px}
  .bar{height:10px;background:#DCE0E7;border-radius:999px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),#3B82F6);border-radius:999px;transition:width .35s ease}
  .ptxt{display:flex;justify-content:space-between;margin-top:6px;font-size:12.5px;color:var(--muted);font-weight:600}
  .ptxt b{color:var(--ink)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 16px 14px;margin-top:6px}
  .zhead{display:flex;align-items:center;gap:12px}
  .znum{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;color:var(--primary);background:#EAF1FF;padding:6px 11px;border-radius:10px;white-space:nowrap}

    background:var(--primary);color:#fff;font-size:17px;font-weight:750;padding:16px;border-radius:14px;box-shadow:0 4px 14px rgba(11,95,255,.28)}
  .maps:active{background:var(--primary-d);transform:translateY(1px)}
  .maps svg{width:20px;height:20px}
  .stops{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .stop{display:flex;align-items:flex-start;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
  .stop.done{background:#F3FBF7;border-color:#CDECDD}
  .box{width:24px;height:24px;border-radius:7px;border:2px solid #C9CFD8;flex:none;margin-top:1px;position:relative}
  .stop.done .box{background:var(--done);border-color:var(--done)}
  .stop.done .box:after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .sc{flex:1;min-width:0}
  .st{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .st .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px}
  .sr{font-size:12px;color:var(--muted);margin-top:1px}
  .screa{font-size:12.5px;margin-top:4px}
  .tag{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:middle}
  .t-new{background:#FDF1DF;color:var(--amber)}
  .t-carr{background:#EDF0F4;color:var(--slate)}
  .t-no{background:#fff;color:var(--slate);border:1px dashed var(--line)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--muted)}
  .pin{flex:none;color:var(--primary);padding:2px 4px}
  .pin svg{width:20px;height:20px;display:block}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;font-weight:700;padding:14px 8px;border-radius:12px;cursor:pointer}
  .btn:active{transform:translateY(1px)}
  .btn.next{background:var(--done);border-color:var(--done);color:#fff}
  .btn.ghost{color:var(--muted)}
  .hint{color:var(--muted);font-size:12px;text-align:center;margin:16px 6px 0;line-height:1.5}
</style>
</head>

const byN=Object.fromEntries(STOPS.map(s=>[s.n,s]));
const ZONES=GROUPS.map(g=>g.map(n=>byN[n]));
const KEY="r01a_coord_v1";
let mem={done:[],z:0};
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){}return mem;}
function save(st){mem=st;try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
let state=load();state.done=new Set(state.done||[]);if(typeof state.z!=="number")state.z=0;
const $=s=>document.querySelector(s);
const persist=()=>save({done:[...state.done],z:state.z});

function zoneURL(z){
  const pts=ZONES[z];
  const origin=C(pts[0]), destination=C(pts[pts.length-1]);
  const way=pts.slice(1,-1).map(C).join("|");
  let u="https://www.google.com/maps/dir/?api=1&origin="+origin+"&destination="+destination+"&travelmode=driving";
  if(way) u+="&waypoints="+encodeURIComponent(way);
  return u+"&dir_action=navigate";
}
function tag(v){return v==="Yes"?["t-new","Nueva"]:v==="No"?["t-no","No"]:["t-carr","Continúa"];}
function firstUnfinishedZone(){for(let i=0;i<ZONES.length;i++)if(ZONES[i].some(s=>!state.done.has(s.n)))return i;return ZONES.length-1;}
function calles(z){const a=[];ZONES[z].forEach(s=>{const c=s.calle.replace(/\s*\d+.*/,'').trim();const t=c.charAt(0)+c.slice(1).toLowerCase();if(!a.includes(t))a.push(t);});return a;}
function renderCard(){
  const z=state.z,zs=ZONES[z];
  const done=zs.filter(s=>state.done.has(s.n)).length;
  const cl=calles(z);const titulo=cl.slice(0,2).join(" · ")+(cl.length>2?" …":"");
  $("#card").innerHTML=`

    <a class="maps" href="${zoneURL(z)}" target="_blank" rel="noopener">

    <div class="stops">${zs.map(s=>{const [tc,tt]=tag(s.new);const d=state.done.has(s.n);

        <div class="sc">
          <div class="st"><span class="n">${String(s.n).padStart(3,'0')}</span>${s.calle}<span class="tag ${tc}">${tt}</span></div>

          <div class="screa">${s.crea}</div><div class="mono">${s.marco}</div>
        </div>
        <a class="pin" href="${single(s)}" target="_blank" rel="noopener" title="Ir solo a esta" onclick="event.stopPropagation()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21s-7-6.3-7-11a7 7 0 1 1 14 0c0 4.7-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></a>
      </div>`;}).join("")}</div>`;
  $("#card").querySelectorAll(".stop").forEach(el=>el.onclick=()=>{const n=+el.dataset.n;state.done.has(n)?state.done.delete(n):state.done.add(n);persist();renderAll();});
}
function renderProg(){$("#fill").style.width=(state.done.size/STOPS.length*100)+"%";$("#pdone").textContent=state.done.size;$("#ptot").textContent=STOPS.length;$("#zc").textContent=state.z+1;$("#zt").textContent=ZONES.length;}
function renderAll(){renderCard();renderProg();}

$("#prevz").onclick=()=>{state.z=Math.max(state.z-1,0);persist();renderAll();window.scrollTo({top:0,behavior:"smooth"});};
